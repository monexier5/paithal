<meta name="msapplication-TileImage" content="https://paithalhill.com/assets/images/rooms-meta.jpg">    

<!-- fb & Whatsapp -->

<!-- Site Name, Title, and Description to be displayed -->
<meta property="og:site_name" content="Paithal Hill Resorts">
<meta property="og:title" content="First resort in Paithalmala">
<meta property="og:description" content="Enjoy mist filled vacation">

<!-- Image to display -->
<!-- Replace   «example.com/image01.jpg» with your own -->
<meta property="og:image" content="https://paithalhill.com/assets/images/rooms-meta.jpg">

<!-- No need to change anything here -->
<meta property="og:type" content="website" />
<meta property="og:image:type" content="image/jpeg">

<!-- Size of image. Any size up to 400. Anything above 300px will not work in WhatsApp -->
<meta property="og:image:width" content="400">
<meta property="og:image:height" content="400">

<!-- Website to visit when clicked in fb or WhatsApp-->
<meta property="og:url" content="https://paithal.netlify.app/">
